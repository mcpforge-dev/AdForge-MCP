name: HolyMedia MCP v2 full-stack Compose smoke

on:
  push:
    branches: ["v2/phase-4.5-verification"]
  pull_request:
    branches: ["v2/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: infra/docker-compose.v2.yml

    steps:
      - uses: actions/checkout@v4

      - name: Build the full Compose stack
        run: docker compose build

      - name: Start the full Compose stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait postgres redis
          docker compose up -d

      - name: Verify API and web readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/health >/tmp/v2-health.json \
              && curl --fail --silent http://127.0.0.1:4000/ready >/tmp/v2-ready.json \
              && curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/v2-web-health.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color api web worker
              exit 1
            fi
            sleep 2
          done

      - name: Verify service health and Redis
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          grep -q '"status":"ok"' /tmp/v2-health.json
          grep -q '"status":"ok"' /tmp/v2-ready.json
          grep -q '"status":"ok"' /tmp/v2-web-health.json

          for attempt in {1..30}; do
            all_ready=true
            for service in postgres redis api worker web; do
              container_id=$(docker compose ps -q "$service")
              if [ -z "$container_id" ]; then
                all_ready=false
                continue
              fi
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
              case "$status" in
                healthy|running) ;;
                *) all_ready=false ;;
              esac
            done
            if [ "$all_ready" = true ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color api web worker
              exit 1
            fi
            sleep 2
          done

      - name: Verify BullMQ worker job
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker compose logs --no-color worker | grep -q 'foundation job processed'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --no-color worker
              exit 1
            fi
            sleep 1
          done

      - name: Graceful shutdown and clean teardown
        if: always()
        shell: bash
        run: |
          docker compose stop worker api web || true
          docker compose ps || true
          docker compose down -v --remove-orphans
          docker compose stop worker api web
          docker compose ps
          docker compose down -v --remove-orphans
