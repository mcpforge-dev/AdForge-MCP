services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: holymedia_v2
      POSTGRES_USER: holymedia
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/<major>/docker.
      - v2-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holymedia -d holymedia_v2"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - v2-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.v2
    environment:
      NODE_ENV: development
      V2_CONFIG_STRICT: "true"
      API_PORT: "4000"
      DATABASE_URL: postgresql://holymedia:local-only-password@postgres:5432/holymedia_v2
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      SESSION_HASH_SECRET: compose-only-session-hash-secret-01234567890123456789
      PROVIDER_CREDENTIAL_ENCRYPTION_KEYS: 1:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      PROVIDER_CREDENTIAL_CURRENT_KEY_VERSION: "1"
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @holymedia/database prisma:deploy && pnpm --filter @holymedia/api start",
      ]
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.v2
    environment:
      NODE_ENV: development
      V2_CONFIG_STRICT: "true"
      DATABASE_URL: postgresql://holymedia:local-only-password@postgres:5432/holymedia_v2
      REDIS_URL: redis://redis:6379
      SESSION_HASH_SECRET: compose-only-session-hash-secret-01234567890123456789
      PROVIDER_CREDENTIAL_ENCRYPTION_KEYS: 1:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      PROVIDER_CREDENTIAL_CURRENT_KEY_VERSION: "1"
    working_dir: /workspace/apps/worker
    command: ["pnpm", "--filter", "@holymedia/worker", "start"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "import('ioredis').then(async ({ default: Redis }) => { const redis = new Redis(process.env.REDIS_URL); await redis.ping(); await redis.quit(); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.v2
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    working_dir: /workspace/apps/web
    command: ["pnpm", "start"]
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      api:
        condition: service_started

volumes:
  v2-postgres:
  v2-redis:
